<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de @media</title>
    <link rel="stylesheet" href="./css/reset.css">
    <style>
        /* Base style for mobile devices */
        body{

        padding: 0;
        background-color: olive;
        color: white;
        font-family: Arial, sans-serif;
        height: 300vh;
    }

        h1{
        text-align: center;
        margin-bottom: 20px;
    }

        .container{
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
    }

        .box{
            width: 100%;
            max-width: 400px;
            height: 200px;
            background-color: black;
    }

        .container-position{
            margin-top: 15px;
            width: 100%;
            height: 600px;
            border: 2px solid red;
            position: relative;
        }

        .filho-tamanho{
            position: absolute;
            /* margin-top: 10px; */
            width: 200px;
            height: 200px;
            background-color: violet;
        }

        .filho01__container-position{
            top: 0;
            left: 0;
        }

        .filho02__container-position{
            top: 0;
            right: 0;
        }

        .filho03__container-position{
            bottom: 0;
            left: 0;
        }

        .filho04__container-position{
            bottom: 0;
            right: 0;
        }

        .whats{
            width: 75px;
            height: 75px;
            background-color: #1ad302;
            border-radius: 50%;
            border: 5px solid #fff;
            position: fixed;
            bottom: 100px;
            right: 60px;
            content: ;
        }

        .whats img{
            width: 100%;
            height: 100%;
        }

        /* For devices with a minimum width of 768px (Medium) */
        @media (min-width: 768px) {
            body {
            background-color: blue;
            color: white;
        }
            .box{
                max-width: 350px;
            }
        }

        /* For devices with a minimum width of 992px (Large) */
        @media (min-width: 992px) {
            body {
            background-color: tan;
            color: black;
        }
            .box {
                max-width: 450px;
            }
        }

    </style>
</head>

<body>
    <h1>Este é um teste de @media</h1>
    <div class="container">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
    </div>

    <div class="container-position">

        <div class="filho01__container-position filho-tamanho"></div>
        <div class="filho02__container-position filho-tamanho"></div>
        <div class="filho03__container-position filho-tamanho"></div>
        <div class="filho04__container-position filho-tamanho"></div>

    </div>

    <div class="whats">
        <img src="./img/whatsapp.png" alt="Logo Whatsapp">
    </div>
</body>
</html>
